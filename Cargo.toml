[package]
name = "nixic"
version = "0.1.0"
edition = "2021"
description = "A TUI music player for NixOS / Nix with YouTube Music support"
license = "MIT"

[dependencies]
anyhow = "1"
crossterm = "0.28"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
mpris-server = { version = "0.10", features = ["tokio"] }
rand = "0.8"
ratatui = "0.29"
ratatui-image = { version = "9", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "net"] }
toml = "0.8"
unicode-width = "0.2"
ureq = "2"

[profile.release]
lto = true
strip = true
